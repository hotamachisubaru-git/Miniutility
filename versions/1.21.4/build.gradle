plugins { id 'net.fabricmc.fabric-loom-remap' version '1.19.1' }
version = '26.3.1'
group = 'org.hotamachisubaru.miniutility'
base.archivesName = 'Miniutility-fabric-1.21.4'
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.java.srcDirs += ['../../common/src/main/java','../../mod-common/src/main/java','../../loader/src/main/java']
sourceSets.test.java.srcDirs += ['../../common/src/test/java']
dependencies {
 minecraft 'com.mojang:minecraft:1.21.4'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.20.0'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
 compileOnly 'net.luckperms:api:5.5'
 testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
jar { from('../../LICENSE') }
