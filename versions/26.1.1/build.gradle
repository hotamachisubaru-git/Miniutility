plugins { id 'net.fabricmc.fabric-loom' version '1.19.1' }
version = '26.3.1'
group = 'org.hotamachisubaru.miniutility'
base.archivesName = 'Miniutility-fabric-26.1.1'
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
sourceSets.main.java.srcDirs += ['../../common/src/main/java','../../mod-common/src/main/java','../../loader/src/main/java']
sourceSets.test.java.srcDirs += ['../../common/src/test/java']
dependencies {
 minecraft 'com.mojang:minecraft:26.1.1'
 
 implementation 'net.fabricmc:fabric-loader:0.20.0'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.145.4+26.1.1'
 compileOnly 'net.luckperms:api:5.5'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
test { useJUnitPlatform() }
jar { from('../../LICENSE') }
