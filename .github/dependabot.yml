# この設定は既定ブランチ master から全プラットフォームを管理します。
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees: ["hotamachisubaru-git"]
    labels: ["dependencies"]
    open-pull-requests-limit: 10
    groups:
      testing:
        patterns: ["org.junit.*", "org.mockito:*"]
      adventure:
        patterns: ["net.kyori:*"]
    ignore:
      # Minecraftの版は versions.json と一緒に手動更新します。
      - dependency-name: "org.spigotmc:spigot-api"
      - dependency-name: "net.kyori:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directories: ["/versions/*"]
    target-branch: "forge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees: ["hotamachisubaru-git"]
    labels: ["dependencies"]
    # Minecraft・ローダー・Gradleは版ごとの対応関係があるため手動更新します。
    allow:
      - dependency-name: "org.junit.*"
      - dependency-name: "net.luckperms:api"
    groups:
      testing:
        patterns: ["org.junit.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directories: ["/versions/*"]
    target-branch: "fabric"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees: ["hotamachisubaru-git"]
    labels: ["dependencies"]
    # Minecraft・ローダー・Gradleは版ごとの対応関係があるため手動更新します。
    allow:
      - dependency-name: "org.junit.*"
      - dependency-name: "net.luckperms:api"
    groups:
      testing:
        patterns: ["org.junit.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees: ["hotamachisubaru-git"]
    labels: ["dependencies"]
    # Gradle Actionは利用条件を確認したうえで手動更新します。
    ignore:
      - dependency-name: "gradle/actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "forge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees: ["hotamachisubaru-git"]
    labels: ["dependencies"]
    # Gradle Actionは利用条件を確認したうえで手動更新します。
    ignore:
      - dependency-name: "gradle/actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "fabric"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees: ["hotamachisubaru-git"]
    labels: ["dependencies"]
    # Gradle Actionは利用条件を確認したうえで手動更新します。
    ignore:
      - dependency-name: "gradle/actions"
    groups:
      actions:
        patterns: ["*"]
