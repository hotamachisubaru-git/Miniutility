name: Fabric builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: fabric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          echo "versions=$(jq -c '{include: map(. + {gradleJava:25})}' versions.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.gradleJava }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: versions/${{ matrix.minecraft }}
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: Miniutility-fabric-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
