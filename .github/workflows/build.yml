name: Forge builds
on:
  push:
    branches: [forge]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          echo "versions=$(jq -c '{include: map(. + {gradleJava:(if .gradle == 7 then 25 else .java end)})}' versions.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.gradleJava }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: versions/${{ matrix.minecraft }}
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@v7
        with:
          name: Miniutility-forge-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
